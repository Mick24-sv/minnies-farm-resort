<!DOCTYPE html>
<html>
<head>
    <title>Vue Test</title>
    <style>
        [v-cloak] {
            display: none;
        }
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="app" v-cloak>
        <h1>Hello {{ message }}</h1>
        <button @click="message = 'Vue is Working!'">Click Me</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.3.4/vue.global.prod.min.js"></script>
    <script>
        const { createApp, ref } = Vue;
        
        createApp({
            setup() {
                const message = ref('Vue.js is loaded!');
                return { message };
            }
        }).mount('#app');
    </script>
</body>
</html>
